org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.code.style=official

# The head of the version; CI appends the run number through -PVERSION (sborka's publish-wip reads
# it through determine-version).
#
# THE HEAD NAMES THE NEXT RELEASE, and moves as soon as one is out. A release goes to the Plugin
# Portal as the plain number given to sborka's `portal.yaml`; every push to `main` goes to `wip` as
# `<head>.<run number>`. In Maven's ordering (and Renovate's) `X.Y.Z.N` sorts ABOVE `X.Y.Z`: left at
# `0.1.0` after 0.1.0 was released from `v0.1.0`, the builds that followed went out as
# `0.1.0.21`–`0.1.0.47`, named after a release they came after and ranking above it, and Renovate
# offered `0.1.0.47` in place of the Portal's `0.1.0`.
version=0.1.1

# WHAT THIS REPOSITORY TELLS THE SHARED CONVENTIONS (sborka).
sborka.group=io.github.youndie
sborka.repository=youndie/zavarnik
sborka.description=A Gradle plugin that trains, verifies and ships a Project Leyden AOT cache for plain JVM applications on the application plugin.
sborka.inceptionYear=2026
# Published to the Gradle Plugin Portal by sborka's portal.yaml (the key lives there); the plugin
# module applies com.gradle.plugin-publish itself.
sborka.portal=true

# 25 to build — sborka's default toolchain, so it is not spelled out here: the plugin's own tests
# train real AOT caches, and the one-step workflow exists from JDK 25 (JEP 514). 17 as the floor: a
# Gradle plugin runs inside Gradle, and Gradle 9 runs on 17+; the JDK the *consumer's application*
# needs is checked by the plugin at configuration time, not by the bytecode level of the plugin jar.
sborka.jvmFloor=17
sborka.junitVersion=6.1.3
