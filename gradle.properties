org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.code.style=official

# The head of the version; CI appends the run number through -PVERSION.
version=0.1.0

# WHAT THIS REPOSITORY TELLS THE SHARED CONVENTIONS (sborka).
sborka.group=io.github.youndie
sborka.repository=youndie/zavarnik
sborka.description=A Gradle plugin that trains, verifies and ships a Project Leyden AOT cache for plain JVM applications on the application plugin.
sborka.inceptionYear=2026

# 25 to build: the plugin's own tests train real AOT caches, and the one-step workflow exists from
# JDK 25 (JEP 514). 17 as the floor: a Gradle plugin runs inside Gradle, and Gradle 9 runs on 17+;
# the JDK the *consumer's application* needs is checked by the plugin at configuration time, not
# by the bytecode level of the plugin jar.
sborka.jvmToolchain=25
sborka.jvmFloor=17
sborka.junitVersion=6.1.3
